name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TampCoreMode: package
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BUILD_LABEL: tamp-bicep

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The standalone Bicep CLI ships as a single binary. We install
      # via the official release assets per OS, pinned to a specific
      # version so CI is reproducible — bump deliberately in PRs.
      - name: Install Bicep CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -Lo /tmp/bicep https://github.com/Azure/bicep/releases/download/v0.43.8/bicep-linux-x64
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install Bicep CLI (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -Lo /tmp/bicep https://github.com/Azure/bicep/releases/download/v0.43.8/bicep-osx-arm64
          chmod +x /tmp/bicep
          sudo mv /tmp/bicep /usr/local/bin/bicep
          bicep --version

      - name: Install Bicep CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Azure/bicep/releases/download/v0.43.8/bicep-win-x64.exe" -OutFile "$env:RUNNER_TEMP\bicep.exe"
          Move-Item -Force "$env:RUNNER_TEMP\bicep.exe" "C:\Windows\System32\bicep.exe"
          bicep --version

      # az is preinstalled on all GitHub-hosted runner images and is
      # required for the `Deploy.Group` integration tests (which only
      # do --help shape probes; no real deployments).
      - name: Verify az CLI
        shell: bash
        run: az version

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Verify SDKs
        shell: bash
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tamp.Bicep.slnx

      - name: Build
        run: dotnet build Tamp.Bicep.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Tamp.Bicep.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

  # Per-PR new-code quality gate. Separate from the build matrix because the
  # scanner is JVM-based and only needs to run once, on Linux, per PR.
  sonar:
    name: SonarCloud (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      # Every Tamp*Mode, not just Core: some repos carry cross-repo
      # ProjectReferences (tauri -> cargo, telegram -> http) that are
      # sibling clones absent on a runner, so Compile fails before analysis
      # without them. A mode for an unused dependency is inert.
      TampCoreMode: package
      TampHttpMode: package
      TampNetCliMode: package
      TampHeftMode: package
      TampCargoMode: package
      TampAzureCliMode: package
      TampAdoRestMode: package

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 10.4.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: dotnet run --project build -- Sonar
